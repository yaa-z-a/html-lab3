<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二级水平导航菜单</title>
    <style>
* {
    margin: 0;
    padding: 0;
    list-style: none;
}
.logo {
    font-size:18px;
    padding:8px 20px;
    font-weight:bold;
}
body>ul:nth-child(2){
    display: flex;
    background-color:#204080;
}
body>ul:nth-child(2) > li{
    position: relative;
}
a{
    display:block;
    color:#ffffff;
    text-decoration:none;
    padding:14px 22px;
    font-size:16px;
}
body>ul:nth-child(2) > li > a:hover{
    background-color:#153060;
}
body>ul:nth-child(2) li>ul{
    position:absolute;
    top:100%;
    left:0;
    background-color:#305099;
    display:none;
}
body>ul:nth-child(2) li:hover>ul{
    display:block;
}
body>ul:nth-child(2) li>ul li a:hover{
    background-color:#1a3b75;
}
    </style>
</head>
<body>
    <ul>
        <li class="logo">欢迎访问湖南文理学院</li>
    </ul>
    <ul>        
        <li><a href="#">首页</a></li>
        <li><a href="#">教学院(部)</a>
            <ul>
                <li><a href="#">计算机与电气工程学院</a></li>
                <li><a href="#">芙蓉学院</a></li>
            </ul>
        </li>
        <li><a href="#">党群机构</a></li>        
        <li><a href="#">行政教辅机构</a></li>
        <li><a href="#">教学科研</a></li>
        <li><a href="#">招生就业</a></li>
        <li><a href="#">国际交流</a></li>
        <li><a href="#">数字图书馆</a></li>
    </ul>    
</body>
</html>
